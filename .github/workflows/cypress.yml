name: Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: greetings-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: |
            greetings-ui/pnpm-lock.yaml
            greeting-ui-e2e/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ./greetings-ui
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: ./greeting-ui-e2e
        run: pnpm install --frozen-lockfile

      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          working-directory: ./greeting-ui-e2e
          install: false
          start: pnpm test
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
          browser: chrome
          record: false

      - name: Upload screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: ./greeting-ui-e2e/cypress/screenshots
          if-no-files-found: ignore