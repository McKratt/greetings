name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    # Every night from Sunday to Monday at 02:00 (GitHub cron is in UTC)
    - cron: '0 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pitest:
    name: Mutation Tests ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [ greetings-service, greetings-stat-service ]
    defaults:
      run:
        working-directory: ./${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-${{ matrix.project }}-mutation-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.project }}-mutation-m2-
      - name: Run PIT mutation tests
        run: mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage -Dthreads=4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish report summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/mutation-summary.py pit "${{ matrix.project }}" "${{ matrix.project }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.project }}
          path: ${{ matrix.project }}/**/target/pit-reports/
          if-no-files-found: warn

  stryker:
    name: Mutation Tests greetings-ui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./greetings-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: greetings-ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: greetings-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Stryker mutation tests
        run: pnpm test:mutation
      - name: Publish report summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/mutation-summary.py stryker greetings-ui greetings-ui/reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-greetings-ui
          path: greetings-ui/reports/mutation/
          if-no-files-found: warn
