# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build + Sonar Analysis + Deploy To DockerHub

on:
  workflow_dispatch:
  push:
    branches: [ master, vuejs ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_greetings_ui:
    name: Build Greetings UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./greetings-ui
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONARCLOUDKEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: greetings-ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: greetings-ui/pnpm-lock.yaml
      - name: Build
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test:coverage
      - name: Sonar
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ./greetings-ui
  build_greetings:
    name: Build Greetings
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: ./greetings-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-greetings-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-greetings-m2-
      - name: Build
        working-directory: ./greetings-service
        run: mvn -B -T 1C clean compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit Test
        working-directory: ./greetings-service
        run: mvn -B -T 1C -Pcoverage -Dmaven.main.skip test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Integration Test
        working-directory: ./greetings-service
        run: mvn -B -T 1C -Pcoverage verify -Dmaven.main.skip -DskipUTs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonar Analysis
        working-directory: ./greetings-service
        run: mvn -B -Pcoverage org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dmaven.test.skip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUDKEY }}
      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'greetings-service/**/target/surefire-reports/TEST-*.xml,greetings-service/**/target/failsafe-reports/TEST-*.xml'
          check_name: 'Greetings Test Report'
  build_stats:
    name: Build Stats
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: ./greetings-stat-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-stats-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-stats-m2-
      - name: Build
        working-directory: ./greetings-stat-service
        run: mvn -B -T 1C clean compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit Test
        working-directory: ./greetings-stat-service
        run: mvn -B -T 1C -Pcoverage test -Dmaven.main.skip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Integration Test
        working-directory: ./greetings-stat-service
        run: mvn -B -T 1C -Pcoverage verify -Dmaven.main.skip -DskipUTs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonar Analysis
        working-directory: ./greetings-stat-service
        run: mvn -B -Pcoverage org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dmaven.test.skip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUDKEY }}
      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'greetings-stat-service/**/target/surefire-reports/TEST-*.xml,greetings-stat-service/**/target/failsafe-reports/TEST-*.xml'
          check_name: 'Stats Test Report'

  deploy_greetings:
    name: Deploy Greetings
    runs-on: ubuntu-latest
    needs: build_greetings
    if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/vuejs')
    defaults:
      run:
        working-directory: ./greetings-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-greetings-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-greetings-m2-
      - name: Package + deploy
        working-directory: ./greetings-service
        run: mvn -B -DskipTests -DskipUTs -PbuildImage package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

  deploy_stats:
    name: Deploy Stats
    runs-on: ubuntu-latest
    needs: build_stats
    if: success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/vuejs')
    defaults:
      run:
        working-directory: ./greetings-stat-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-stats-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-stats-m2-
      - name: Package Jar + Build Image
        working-directory: ./greetings-stat-service
        run: mvn -B -DskipTests -DskipUTs -PbuildImage package --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy image
        run: mvn -B docker:push -Dregistry.username=${REGISTRY_USERNAME} -Dregistry.password=${REGISTRY_PASSWORD}
        working-directory: ./greetings-stat-service/stat-bootstrap
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ deploy_stats, deploy_greetings ]
    if: success()
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: ./greetings-e2e
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: E2E Tests
        run: mvn -B test --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'greetings-e2e/**/target/surefire-reports/TEST-*.xml'
          check_name: 'E2E Test Report'

  cypress:
    name: Cypress Tests
    runs-on: ubuntu-latest
    needs: [ deploy_stats, deploy_greetings ]
    if: success()
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: greetings-ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            greetings-ui/pnpm-lock.yaml
            greeting-ui-e2e/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ./greetings-ui
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: ./greeting-ui-e2e
        run: pnpm install --frozen-lockfile

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./greeting-ui-e2e
          install: false
          start: pnpm test
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
          browser: chrome
          record: false

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: ./greeting-ui-e2e/cypress/screenshots
          if-no-files-found: ignore

      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'greeting-ui-e2e/results/*.xml'
          check_name: 'Cypress Test Report'
