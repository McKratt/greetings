# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-parent" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-service" # Location of package manifests
    exclude-paths:
      - ../greetings-parent
    schedule:
      interval: "weekly"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-stat-service" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-e2e" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/greetings-ui" # Location of package manifests
    schedule:
      interval: "weekly"
