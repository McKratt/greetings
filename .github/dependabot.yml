# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-parent" # Location of package manifests
    schedule:
      interval: "daily"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-service" # Location of package manifests
    schedule:
      interval: "daily"
    # Versions are managed in greetings-parent, which has its own entry above
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
      - dependency-name: "org.junit:junit-bom"
      - dependency-name: "org.testcontainers:testcontainers-bom"
      - dependency-name: "io.cucumber:*"
      - dependency-name: "au.com.dius.pact.*:*"
      - dependency-name: "org.wiremock:wiremock-standalone"
      - dependency-name: "com.jparams:to-string-verifier"
      - dependency-name: "io.rest-assured:rest-assured-bom"
      - dependency-name: "org.jacoco:jacoco-maven-plugin"
      - dependency-name: "io.fabric8:docker-maven-plugin"
      - dependency-name: "org.sonarsource.scanner.maven:sonar-maven-plugin"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-stat-service" # Location of package manifests
    schedule:
      interval: "daily"
    # Versions are managed in greetings-parent, which has its own entry above
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
      - dependency-name: "org.junit:junit-bom"
      - dependency-name: "org.testcontainers:testcontainers-bom"
      - dependency-name: "io.cucumber:*"
      - dependency-name: "au.com.dius.pact.*:*"
      - dependency-name: "org.wiremock:wiremock-standalone"
      - dependency-name: "com.jparams:to-string-verifier"
      - dependency-name: "io.rest-assured:rest-assured-bom"
      - dependency-name: "org.jacoco:jacoco-maven-plugin"
      - dependency-name: "io.fabric8:docker-maven-plugin"
      - dependency-name: "org.sonarsource.scanner.maven:sonar-maven-plugin"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/greetings-e2e" # Location of package manifests
    schedule:
      interval: "daily"
    groups:
      libraries:
        exclude-patterns:
          - "org.springframework.*"
        patterns:
          - "*"
      spring:
        patterns:
          - "org.springframework.*:*"
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/greetings-ui" # Location of package manifests
    schedule:
      interval: "daily"
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "@vitejs/plugin-vue"
          - "eslint-plugin-vue"
